    <text x="930" y="592" font-family="Cambria, Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" fill="#E08A2E">D</text>
    <text x="891" y="442" font-family="Cambria, Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" fill="#E08A2E">E</text>
