<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="coverPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4F9C" />
      <stop offset="100%" stop-color="#4A90D9" />
    </linearGradient>
    <linearGradient id="coverRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B4F9C" />
      <stop offset="100%" stop-color="#4A90D9" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <g id="cover-bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
    <rect x="0" y="0" width="1280" height="8" fill="#1B4F9C" />
  </g>

  <g id="cover-visual">
