# dsh-recall-plugin bundle patch
#
# 持久插件挂载层（dsh.bundle.patch）：安装后由 DSH CLI 的 bundle 协调
# 自动把本包加进 profile 的 dsh.profile.bundles，启动时合并这一个
# insert 行——无需手动编辑任何 profile 文件。
#
# 安装（发布到 npm 后）：
#   dsh plugin --profile web add dsh-recall-plugin@<version>
- insert:
    - id: recall
      name: 'dsh-recall-plugin'
      # 默认值随层下发：用户在自己 profile 的 cordis.patch.yml 里按 id: recall
      # 重述整行并改写这些键即可覆盖（patch 按行替换 config，不做深度合并）。
      # 环境变量 DSH_RECALL_GC_SNAPS / DSH_RECALL_GC_HOURS 仍可强制覆盖前两项。
      config:
        gcSnaps: 50            # 每积累多少条快照触发一次 git gc
        gcHours: 24            # 距上次 gc 超过多少小时触发（与条数先到先触发）
        maxFileBytes: 104857600  # 超过该大小的文件不进快照、不被回退触碰
        refillDraft: true      # 撤回后把被撤回的消息文本回填到输入框
        # baseExcludes: ['.git', 'node_modules/', '.dsh-recall-snapshots/']  # 基础排除表（gitignore 语法）
